name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate manifest
        run: jq -e . manifest.json >/dev/null

      - name: Validate Bash syntax
        run: bash -n opensky-fetch locate save-credentials tests/opensky-fetch.test.sh

      - name: Test radar model
        run: node --test tests/radar-model.test.js

      - name: Test OpenSky helper
        run: bash tests/opensky-fetch.test.sh
